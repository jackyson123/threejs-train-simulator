<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>港鐵 3D 列車駕駛模擬器 | MTR Three.js Train Simulator</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #000;
      color: #fff;
    }
    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .interactive { pointer-events: auto; }
    
    /* MTR Inspired Top HUD Header */
    .top-hud { display: flex; justify-content: space-between; align-items: flex-start; }
    .brand-title {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 12px 22px;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      border-left: 6px solid #dc2626; /* MTR Red Line accent */
    }
    .brand-title h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #f8fafc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-title p {
      font-size: 12px;
      color: #38bdf8;
      margin-top: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    
    .hud-stats { display: flex; gap: 12px; }
    .stat-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 18px;
      border-radius: 12px;
      min-width: 110px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: 600; }
    .stat-value { font-size: 24px; font-weight: 800; color: #f8fafc; font-family: 'Courier New', Courier, monospace; }
    .stat-unit { font-size: 11px; color: #38bdf8; margin-left: 2px; }
    
    /* Bottom Driving Controls */
    .controls-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
    .control-panel {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 16px 20px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      gap: 20px;
      align-items: center;
    }
    .lever-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .lever-label { font-size: 11px; font-weight: 700; color: #e2e8f0; letter-spacing: 0.5px; }
    .slider-vertical { -webkit-appearance: slider-vertical; width: 26px; height: 115px; cursor: pointer; }
    
    .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f1f5f9;
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.22); border-color: #38bdf8; color: #fff; transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); }
    .btn-horn { background: linear-gradient(135deg, #dc2626, #991b1b); border: none; color: #fff; box-shadow: 0 4px 14px rgba(220, 38, 38, 0.4); }
    .btn-horn:hover { background: linear-gradient(135deg, #ef4444, #dc2626); }
    
    .progress-bar-bg { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.12); border-radius: 3px; margin-top: 5px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #ef4444); transition: width 0.1s linear; }

    @media (max-width: 768px) {
      .hud-stats { flex-wrap: wrap; }
      .controls-bottom { flex-direction: column; align-items: stretch; }
      .control-panel { justify-content: space-between; }
    }
  </style>

  <!-- Load Global Three.js Standard UMD (Zero CORS/ImportMap dependencies) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- WebGL 3D Canvas -->
  <div id="webgl-container"></div>

  <!-- HUD Control Overlay -->
  <div id="ui-container">
    <div class="top-hud">
      <div class="brand-title interactive">
        <h1>🚇 MTR 港鐵模擬駕駛器</h1>
        <p id="zone-indicator">當前路段：🌲 郊外綠化帶</p>
      </div>

      <div class="hud-stats">
        <div class="stat-card">
          <div class="stat-label">時速 Speed</div>
          <div><span class="stat-value" id="val-speed">0</span><span class="stat-unit">km/h</span></div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="speed-bar"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">推力 Throttle</div>
          <div><span class="stat-value" id="val-power">0</span><span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">煞車 Brake</div>
          <div><span class="stat-value" id="val-brake">0</span><span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">里程 Distance</div>
          <div><span class="stat-value" id="val-dist">0.00</span><span class="stat-unit">km</span></div>
        </div>
      </div>
    </div>

    <!-- Bottom Controls Dashboard -->
    <div class="controls-bottom">
      <div class="control-panel interactive">
        <div class="lever-container">
          <div class="lever-label">⚡ 電門 Power (W)</div>
          <input type="range" class="slider-vertical" id="slider-power" min="0" max="100" value="0">
        </div>
        <div class="lever-container">
          <div class="lever-label">🛑 煞車 Brake (S)</div>
          <input type="range" class="slider-vertical" id="slider-brake" min="0" max="100" value="0">
        </div>
      </div>

      <div class="control-panel interactive">
        <div class="btn-grid">
          <button class="btn btn-horn" id="btn-horn">🔊 鳴笛 Horn (H)</button>
          <button class="btn" id="btn-camera">🎥 視角: 車外跟隨</button>
          <button class="btn" id="btn-weather">☀️ 天氣: 晴天</button>
          <button class="btn" id="btn-train">🚆 車款: 港鐵現代化列車</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Game Physics & View State
    const state = {
      speed: 0,
      maxSpeed: 130,      // MTR typical line operational max speed
      power: 0,
      brake: 0,
      distance: 0,
      cameraMode: 1,      // 0: Cockpit, 1: Follow, 2: Bird's Eye
      weatherMode: 0,     // 0: Sunny, 1: Rain, 2: Night
      trainType: 0,       // 0: MTR Metro-Cammell / Modern, 1: Express
      trainZ: 0
    };

    let scene, camera, renderer;
    let trainGroup, headLightLeft, headLightRight, rainParticles;
    const vehicles = [];      // Cars & Buses moving on roads
    const pedestrians = [];   // Platform passengers & street walkers
    const TRACK_LENGTH = 5000; // Loop length

    function initScene() {
      const container = document.getElementById('webgl-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x38bdf8);
      scene.fog = new THREE.FogExp2(0x38bdf8, 0.0006);

      camera = new THREE.PerspectiveCamera(65, width / height, 0.1, 3500);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      
      container.appendChild(renderer.domElement);

      // Environment Lights
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
      dirLight.position.set(200, 250, -100);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      createEnvironment();
      createRoadsAndTraffic();
      createTracksAndFlyover();
      createMTRTrain();
      createRain();

      window.addEventListener('resize', onWindowResize);
    }

    function createEnvironment() {
      // Ground plane
      const groundGeo = new THREE.PlaneGeometry(1400, TRACK_LENGTH * 2);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Countryside Vegetation
      const treeGeo = new THREE.ConeGeometry(4, 12, 5);
      const trunkGeo = new THREE.CylinderGeometry(0.6, 0.6, 4);
      const treeMat = new THREE.MeshStandardMaterial({ color: 0x15803d });
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x78350f });

      // HK High-rise Skyscrapers palette
      const buildingColors = [0x475569, 0x334155, 0x0284c7, 0x0369a1, 0x64748b, 0x1e293b];
      const windowMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });

      for (let z = 0; z < TRACK_LENGTH; z += 40) {
        // --- ZONE 1: 0m ~ 2000m (Countryside & Greenery) ---
        if (z < 2000) {
          [-28, 28, -45, 45].forEach(xOffset => {
            if (Math.random() > 0.2) {
              const group = new THREE.Group();
              const trunk = new THREE.Mesh(trunkGeo, trunkMat);
              trunk.position.y = 2;
              const leaves = new THREE.Mesh(treeGeo, treeMat);
              leaves.position.y = 8;
              leaves.castShadow = true;
              group.add(trunk, leaves);
              group.position.set(xOffset + (Math.random() * 8 - 4), 0, z);
              scene.add(group);
            }
          });
        } 
        // --- ZONE 2: 2000m ~ 4800m (Hong Kong Urban City & Elevated MTR Station) ---
        else {
          // MTR Kwun Tong Line style Elevated Station at 2800m
          if (z === 2800) {
            createMTRElevatedStation(z);
          }

          // Dense HK Skyscrapers
          [-42, 42, -80, 80].forEach(xOffset => {
            if (Math.random() > 0.12) {
              const height = 40 + Math.random() * 110; // Tall HK towers
              const width = 22 + Math.random() * 16;
              const depth = 22 + Math.random() * 16;
              
              const bldgGeo = new THREE.BoxGeometry(width, height, depth);
              const bldgMat = new THREE.MeshStandardMaterial({
                color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
                roughness: 0.25,
                metalness: 0.2
              });
              const building = new THREE.Mesh(bldgGeo, bldgMat);
              building.position.set(xOffset + (xOffset > 0 ? 18 : -18), height / 2, z);
              scene.add(building);

              // Lit Windows Grid
              if (Math.random() > 0.25) {
                const winGeo = new THREE.BoxGeometry(width + 0.2, height * 0.85, depth + 0.2);
                const winMesh = new THREE.Mesh(winGeo, windowMat);
                winMesh.position.copy(building.position);
                winMesh.scale.set(0.98, 0.96, 0.98);
                scene.add(winMesh);
              }
            }
          });
        }
      }
    }

    function createRoadsAndTraffic() {
      // Parallel Road below/beside railway viaduct
      const roadGeo = new THREE.PlaneGeometry(16, TRACK_LENGTH * 2);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.set(-22, 0.05, TRACK_LENGTH / 2);
      scene.add(road);

      // Road markings
      for (let z = 0; z < TRACK_LENGTH; z += 15) {
        const stripeGeo = new THREE.PlaneGeometry(0.6, 6);
        const stripeMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
        const stripe = new THREE.Mesh(stripeGeo, stripeMat);
        stripe.rotation.x = -Math.PI / 2;
        stripe.position.set(-22, 0.08, z);
        scene.add(stripe);
      }

      // Populate Moving Vehicles (HK Double-Decker Buses & Sedans)
      for (let i = 0; i < 20; i++) {
        const isBus = Math.random() > 0.5;
        const vGroup = new THREE.Group();

        if (isBus) {
          // HK Red/Yellow Double Decker Bus
          const bodyGeo = new THREE.BoxGeometry(3.2, 4.2, 10);
          const bodyMat = new THREE.MeshStandardMaterial({ color: 0xdc2626 }); // HK Bus Red
          const body = new THREE.Mesh(bodyGeo, bodyMat);
          body.position.y = 2.1;

          const roofGeo = new THREE.BoxGeometry(3.2, 0.3, 10);
          const roofMat = new THREE.MeshStandardMaterial({ color: 0xfacc15 }); // Yellow roof accent
          const roof = new THREE.Mesh(roofGeo, roofMat);
          roof.position.y = 4.25;

          vGroup.add(body, roof);
        } else {
          // Taxi / Private Sedan
          const bodyGeo = new THREE.BoxGeometry(2.6, 1.6, 5.5);
          const bodyMat = new THREE.MeshStandardMaterial({ color: Math.random() > 0.4 ? 0xdc2626 : 0x0284c7 }); // Taxi Red / Blue
          const body = new THREE.Mesh(bodyGeo, bodyMat);
          body.position.y = 0.8;
          vGroup.add(body);
        }

        const spawnZ = Math.random() * TRACK_LENGTH;
        vGroup.position.set(-22 + (Math.random() > 0.5 ? 3.5 : -3.5), 0, spawnZ);
        scene.add(vGroup);

        vehicles.push({
          group: vGroup,
          speed: 25 + Math.random() * 35,
          dir: Math.random() > 0.5 ? 1 : -1
        });
      }
    }

    function createTracksAndFlyover() {
      const trackGroup = new THREE.Group();
      const viaductHeight = 6.0; // Elevated Railway Viaduct Bridge (天橋)

      // Viaduct Bridge Concrete Deck
      const deckGeo = new THREE.BoxGeometry(10, 1.2, TRACK_LENGTH * 2);
      const deckMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.7 });
      const deck = new THREE.Mesh(deckGeo, deckMat);
      deck.position.set(0, viaductHeight, TRACK_LENGTH / 2);
      trackGroup.add(deck);

      // Support Pillars (天橋橋墩)
      const pillarGeo = new THREE.CylinderGeometry(1.8, 1.8, viaductHeight);
      const pillarMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
      for (let z = 0; z < TRACK_LENGTH; z += 40) {
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.set(0, viaductHeight / 2, z);
        trackGroup.add(pillar);
      }

      // Steel Rails (鋼軌)
      const railGeo = new THREE.BoxGeometry(0.25, 0.35, TRACK_LENGTH * 2);
      const railMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.9, roughness: 0.1 });
      
      const leftRail = new THREE.Mesh(railGeo, railMat);
      leftRail.position.set(-1.8, viaductHeight + 0.8, TRACK_LENGTH / 2);
      const rightRail = new THREE.Mesh(railGeo, railMat);
      rightRail.position.set(1.8, viaductHeight + 0.8, TRACK_LENGTH / 2);
      trackGroup.add(leftRail, rightRail);

      // Sleepers (枕木)
      const sleeperGeo = new THREE.BoxGeometry(4.8, 0.2, 0.6);
      const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
      for (let z = 0; z < TRACK_LENGTH; z += 2.5) {
        const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
        sleeper.position.set(0, viaductHeight + 0.6, z);
        trackGroup.add(sleeper);
      }

      scene.add(trackGroup);
    }

    function createMTRElevatedStation(zPos) {
      const stationGroup = new THREE.Group();
      const vH = 6.0;

      // Platform Floor (月台)
      const platGeo = new THREE.BoxGeometry(10, 1.5, 220);
      const platMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
      const platform = new THREE.Mesh(platGeo, platMat);
      platform.position.set(8.5, vH + 0.75, zPos);
      stationGroup.add(platform);

      // MTR Signature Glass Screen Roof (月台天幕屋頂)
      const roofGeo = new THREE.BoxGeometry(12, 0.6, 220);
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 }); // MTR Blue accent
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.set(8.5, vH + 8.5, zPos);
      stationGroup.add(roof);

      // Roof Columns & Glass Barriers
      const pillarGeo = new THREE.CylinderGeometry(0.35, 0.35, 7.5);
      const pillarMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
      for (let z = zPos - 100; z <= zPos + 100; z += 25) {
        const p1 = new THREE.Mesh(pillarGeo, pillarMat);
        p1.position.set(4, vH + 4.5, z);
        const p2 = new THREE.Mesh(pillarGeo, pillarMat);
        p2.position.set(13, vH + 4.5, z);
        stationGroup.add(p1, p2);

        // Platform Waiting Passengers (月台乘客)
        createPedestrian(8.5, vH + 1.5, z + Math.random() * 6 - 3);
      }

      // MTR Station Signboard (觀塘/荃灣綫風格站牌)
      const signGeo = new THREE.BoxGeometry(0.3, 1.8, 8);
      const signMat = new THREE.MeshStandardMaterial({ color: 0xdc2626 }); // MTR Red
      const sign = new THREE.Mesh(signGeo, signMat);
      sign.position.set(4, vH + 5, zPos);
      stationGroup.add(sign);

      scene.add(stationGroup);
    }

    function createPedestrian(x, y, z) {
      const pGroup = new THREE.Group();

      const headGeo = new THREE.SphereGeometry(0.35, 8, 8);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.6;

      const bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.9);
      const bodyMat = new THREE.MeshStandardMaterial({ color: Math.random() > 0.5 ? 0xef4444 : 0x0284c7 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.95;

      pGroup.add(head, body);
      pGroup.position.set(x, y, z);
      scene.add(pGroup);

      pedestrians.push({
        group: pGroup,
        baseZ: z,
        speed: 0.4 + Math.random() * 0.6,
        dir: Math.random() > 0.5 ? 1 : -1
      });
    }

    function createMTRTrain() {
      if (trainGroup) scene.remove(trainGroup);
      trainGroup = new THREE.Group();

      const carriageLength = 26;
      const vH = 6.0; // Elevated rail height

      // Train Carriages (2 Cars connected)
      for (let i = 0; i < 2; i++) {
        const carGroup = new THREE.Group();
        const offsetZ = -i * (carriageLength + 1);

        // Metallic Silver Main Body (港鐵銀灰色車身)
        const bodyGeo = new THREE.BoxGeometry(3.6, 3.8, carriageLength);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.8, roughness: 0.2 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.set(0, vH + 2.7, offsetZ);
        body.castShadow = true;
        carGroup.add(body);

        // MTR Red Line Accent Stripe (車頭/車身紅藍色拉花)
        const stripeGeo = new THREE.BoxGeometry(3.64, 0.4, carriageLength);
        const stripeMat = new THREE.MeshStandardMaterial({ color: 0xdc2626 }); // Red Line
        const stripe = new THREE.Mesh(stripeGeo, stripeMat);
        stripe.position.set(0, vH + 2.0, offsetZ);
        carGroup.add(stripe);

        // Front Head Cab Nose Styling (僅第一卡車廂)
        if (i === 0) {
          const noseGeo = new THREE.BoxGeometry(3.6, 3.6, 4);
          const noseMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5, roughness: 0.3 });
          const nose = new THREE.Mesh(noseGeo, noseMat);
          nose.position.set(0, vH + 2.6, carriageLength / 2 + 1.8);
          carGroup.add(nose);

          // Dual Headlights
          headLightLeft = new THREE.SpotLight(0xfffbebe, 0, 220, Math.PI / 5, 0.4);
          headLightLeft.position.set(-1.2, vH + 2.2, carriageLength / 2 + 3.5);
          headLightLeft.target.position.set(-1.2, 0, carriageLength / 2 + 80);

          headLightRight = new THREE.SpotLight(0xfffbebe, 0, 220, Math.PI / 5, 0.4);
          headLightRight.position.set(1.2, vH + 2.2, carriageLength / 2 + 3.5);
          headLightRight.target.position.set(1.2, 0, carriageLength / 2 + 80);

          carGroup.add(headLightLeft, headLightLeft.target);
          carGroup.add(headLightRight, headLightRight.target);
        }

        // Passenger Windows
        const windowMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1 });
        for (let z = -carriageLength / 2 + 3; z < carriageLength / 2 - 2; z += 3.8) {
          const winLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.3, 2.4), windowMat);
          winLeft.position.set(-1.81, vH + 3.2, offsetZ + z);
          const winRight = winLeft.clone();
          winRight.position.x = 1.81;
          carGroup.add(winLeft, winRight);
        }

        trainGroup.add(carGroup);
      }

      scene.add(trainGroup);
    }

    function createRain() {
      const rainCount = 4500;
      const rainGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(rainCount * 3);

      for (let i = 0; i < rainCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 220;
        positions[i + 1] = Math.random() * 110;
        positions[i + 2] = (Math.random() - 0.5) * 220;
      }

      rainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const rainMat = new THREE.PointsMaterial({ color: 0xe2e8f0, size: 0.4, transparent: true, opacity: 0.6 });
      rainParticles = new THREE.Points(rainGeo, rainMat);
      rainParticles.visible = false;
      scene.add(rainParticles);
    }

    function updateCamera() {
      if (!trainGroup) return;
      const trainPos = trainGroup.position;
      const vH = 6.0;

      if (state.cameraMode === 0) {
        // Cockpit view at windshield
        camera.position.set(trainPos.x, trainPos.y + vH + 2.8, trainPos.z + 16);
        camera.lookAt(trainPos.x, trainPos.y + vH + 2.2, trainPos.z + 140);
      } else if (state.cameraMode === 1) {
        // Follow camera
        camera.position.set(trainPos.x + 16, trainPos.y + vH + 10, trainPos.z - 35);
        camera.lookAt(trainPos.x, trainPos.y + vH + 2, trainPos.z + 10);
      } else if (state.cameraMode === 2) {
        // Bird's Eye Top View
        camera.position.set(trainPos.x, trainPos.y + vH + 80, trainPos.z - 5);
        camera.lookAt(trainPos.x, trainPos.y + vH, trainPos.z + 30);
      }
    }

    function updateWeatherUI() {
      const btn = document.getElementById('btn-weather');
      if (state.weatherMode === 0) {
        scene.background.setHex(0x38bdf8);
        scene.fog.color.setHex(0x38bdf8);
        if (headLightLeft) { headLightLeft.intensity = 0; headLightRight.intensity = 0; }
        rainParticles.visible = false;
        btn.innerText = "☀️ 天氣: 晴天";
      } else if (state.weatherMode === 1) {
        scene.background.setHex(0x475569);
        scene.fog.color.setHex(0x475569);
        if (headLightLeft) { headLightLeft.intensity = 2.0; headLightRight.intensity = 2.0; }
        rainParticles.visible = true;
        btn.innerText = "🌧️ 天氣: 雨天";
      } else if (state.weatherMode === 2) {
        scene.background.setHex(0x020617);
        scene.fog.color.setHex(0x020617);
        if (headLightLeft) { headLightLeft.intensity = 4.0; headLightRight.intensity = 4.0; }
        rainParticles.visible = false;
        btn.innerText = "🌙 天氣: 夜晚";
      }
    }

    function playHornSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sawtooth';
        osc2.type = 'sawtooth';
        osc1.frequency.setValueAtTime(293.66, audioCtx.currentTime); // MTR Horn pitch
        osc2.frequency.setValueAtTime(349.23, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.6);

        osc1.connect(gain); osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(); osc2.start();
        osc1.stop(audioCtx.currentTime + 1.6);
        osc2.stop(audioCtx.currentTime + 1.6);
      } catch (e) {}
    }

    function updatePhysics(delta) {
      const accel = (state.power / 100) * 18.0;
      const decel = (state.brake / 100) * 35.0 + 1.5;

      if (state.power > 0) state.speed += accel * delta;
      if (state.brake > 0 || state.power === 0) state.speed -= decel * delta;

      state.speed = Math.max(0, Math.min(state.maxSpeed, state.speed));

      const moveDistance = ((state.speed * 1000) / 3600) * delta;
      state.trainZ += moveDistance;
      state.distance += moveDistance;

      if (trainGroup) trainGroup.position.z = state.trainZ;

      // Loop track seamlessly
      if (state.trainZ > TRACK_LENGTH) {
        state.trainZ -= TRACK_LENGTH;
        if (trainGroup) trainGroup.position.z = state.trainZ;
      }

      // Zone Indicator Text Update
      const zoneEl = document.getElementById('zone-indicator');
      if (state.trainZ < 2000) {
        zoneEl.innerText = "當前路段：🌲 郊外綠化帶";
      } else if (state.trainZ >= 2000 && state.trainZ < 3200) {
        zoneEl.innerText = "當前路段：🚉 觀塘綫高架月台 (MTR Station)";
      } else {
        zoneEl.innerText = "當前路段：🏙️ 九龍繁華摩天大樓區";
      }

      // Move Road Traffic (Cars & Buses)
      vehicles.forEach(v => {
        v.group.position.z += v.speed * v.dir * delta;
        if (v.group.position.z > TRACK_LENGTH) v.group.position.z = 0;
        if (v.group.position.z < 0) v.group.position.z = TRACK_LENGTH;
      });

      // Animate Pedestrians
      pedestrians.forEach(p => {
        p.group.position.z += p.speed * p.dir * delta;
        if (Math.abs(p.group.position.z - p.baseZ) > 8) {
          p.dir *= -1;
        }
      });

      if (rainParticles && rainParticles.visible) {
        rainParticles.position.z = state.trainZ;
        const positions = rainParticles.geometry.attributes.position.array;
        for (let i = 1; i < positions.length; i += 3) {
          positions[i] -= 90 * delta;
          if (positions[i] < 0) positions[i] = 110;
        }
        rainParticles.geometry.attributes.position.needsUpdate = true;
      }
    }

    function updateUI() {
      document.getElementById('val-speed').innerText = Math.round(state.speed);
      document.getElementById('val-power').innerText = state.power;
      document.getElementById('val-brake').innerText = state.brake;
      document.getElementById('val-dist').innerText = (state.distance / 1000).toFixed(2);
      document.getElementById('speed-bar').style.width = `${(state.speed / state.maxSpeed) * 100}%`;
    }

    function setupEvents() {
      const sliderPower = document.getElementById('slider-power');
      const sliderBrake = document.getElementById('slider-brake');

      sliderPower.addEventListener('input', (e) => {
        state.power = parseInt(e.target.value);
        if (state.power > 0 && state.brake > 0) {
          state.brake = 0;
          sliderBrake.value = 0;
        }
      });

      sliderBrake.addEventListener('input', (e) => {
        state.brake = parseInt(e.target.value);
        if (state.brake > 0 && state.power > 0) {
          state.power = 0;
          sliderPower.value = 0;
        }
      });

      document.getElementById('btn-horn').addEventListener('click', playHornSound);

      document.getElementById('btn-camera').addEventListener('click', () => {
        state.cameraMode = (state.cameraMode + 1) % 3;
        const names = ["駕駛艙 (Cockpit)", "車外跟隨 (Follow)", "鳥瞰視角 (Bird's Eye)"];
        document.getElementById('btn-camera').innerText = `🎥 視角: ${names[state.cameraMode]}`;
      });

      document.getElementById('btn-weather').addEventListener('click', () => {
        state.weatherMode = (state.weatherMode + 1) % 3;
        updateWeatherUI();
      });

      document.getElementById('btn-train').addEventListener('click', () => {
        state.trainType = state.trainType === 0 ? 1 : 0;
        state.maxSpeed = state.trainType === 0 ? 130 : 200;
        document.getElementById('btn-train').innerText = state.trainType === 0 ? "🚆 車款: 港鐵現代化列車" : "🚆 車款: 機場快綫型列車";
        createMTRTrain();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
          state.power = Math.min(100, state.power + 10);
          state.brake = 0;
        } else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') {
          state.brake = Math.min(100, state.brake + 10);
          state.power = 0;
        } else if (e.key === 'h' || e.key === 'H') {
          playHornSound();
        } else if (e.key === 'c' || e.key === 'C') {
          document.getElementById('btn-camera').click();
        }
        sliderPower.value = state.power;
        sliderBrake.value = state.brake;
      });
    }

    function onWindowResize() {
      if (!renderer || !camera) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      updatePhysics(delta);
      updateCamera();
      updateUI();
      renderer.render(scene, camera);
    }

    // Initialize after window loads completely
    window.onload = function() {
      initScene();
      setupEvents();
      animate();
    };
  </script>
</body>
</html>
