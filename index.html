<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 高真實感港鐵模擬列車駕駛器 | HK MTR Train Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", sans-serif;
      background: #000;
      color: #fff;
    }
    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .interactive { pointer-events: auto; }
    .top-hud { display: flex; justify-content: space-between; align-items: flex-start; }
    .brand-title {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .brand-title h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #e11d48, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-title p { font-size: 11px; color: #cbd5e1; margin-top: 2px; }
    .hud-stats { display: flex; gap: 12px; }
    .stat-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 18px;
      border-radius: 12px;
      min-width: 105px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
    .stat-value { font-size: 22px; font-weight: 800; color: #f8fafc; font-family: monospace; }
    .stat-unit { font-size: 11px; color: #38bdf8; margin-left: 2px; }
    .controls-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
    .control-panel {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .lever-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .lever-label { font-size: 11px; font-weight: 600; color: #cbd5e1; }
    .slider-vertical { -webkit-appearance: slider-vertical; width: 24px; height: 110px; cursor: pointer; }
    .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.2); border-color: #38bdf8; color: #fff; }
    .btn-horn { background: linear-gradient(135deg, #e11d48, #be123c); border: none; color: #fff; }
    .progress-bar-bg { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; margin-top: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #f43f5e); transition: width 0.1s linear; }

    #error-display {
      position: absolute;
      top: 80px;
      left: 20px;
      z-index: 100;
      background: rgba(239, 68, 68, 0.9);
      color: #fff;
      padding: 10px 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      display: none;
    }
  </style>

  <!-- 全球高速 JSDelivr CDN (附帶自動備用防線) -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script>
    if (typeof THREE === 'undefined') {
      document.write('<script src="https://unpkg.com/three@0.128.0/build/three.min.js"><\/script>');
    }
  </script>
</head>
<body>

  <div id="error-display"></div>
  <div id="webgl-container"></div>

  <div id="ui-container">
    <div class="top-hud">
      <div class="brand-title interactive">
        <h1>🚄 REALISTIC MTR SIMULATOR</h1>
        <p id="zone-indicator">當前位置：🏞️ 郊區高架橋段</p>
      </div>

      <div class="hud-stats">
        <div class="stat-card">
          <div class="stat-label">時速 Speed</div>
          <div><span class="stat-value" id="val-speed">0</span><span class="stat-unit">km/h</span></div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="speed-bar"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">電門 Power</div>
          <div><span class="stat-value" id="val-power">0</span><span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">煞車 Brake</div>
          <div><span class="stat-value" id="val-brake">0</span><span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">里程 Distance</div>
          <div><span class="stat-value" id="val-dist">0.00</span><span class="stat-unit">km</span></div>
        </div>
      </div>
    </div>

    <div class="controls-bottom">
      <div class="control-panel interactive">
        <div class="lever-container">
          <div class="lever-label">⚡ 電門 (P)</div>
          <input type="range" class="slider-vertical" id="slider-power" min="0" max="100" value="0">
        </div>
        <div class="lever-container">
          <div class="lever-label">🛑 煞車 (B)</div>
          <input type="range" class="slider-vertical" id="slider-brake" min="0" max="100" value="0">
        </div>
      </div>

      <div class="control-panel interactive">
        <div class="btn-grid">
          <button class="btn btn-horn" id="btn-horn">🔊 鳴笛 (Horn)</button>
          <button class="btn" id="btn-camera">🎥 視角: 全景跟隨</button>
          <button class="btn" id="btn-weather">☀️ 天氣: 晴天</button>
          <button class="btn" id="btn-train">🚆 車款: 港鐵市區綫</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 錯誤捕獲機制
    window.onerror = function(message, source, lineno, colno, error) {
      const errBox = document.getElementById('error-display');
      errBox.style.display = 'block';
      errBox.innerText = '系統錯誤: ' + message + ' (Line ' + lineno + ')';
    };

    const state = {
      speed: 0,
      maxSpeed: 130,
      power: 0,
      brake: 0,
      distance: 0,
      cameraMode: 1, // 0: 駕駛艙, 1: 全景跟隨, 2: 鳥瞰
      weatherMode: 0,
      trainType: 0,
      trainZ: 0
    };

    let scene, camera, renderer;
    let trainGroup, headLight, rainParticles;
    const vehicles = [];
    const TRACK_LENGTH = 5000;

    function initScene() {
      const container = document.getElementById('webgl-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      if (typeof THREE === 'undefined') {
        throw new Error("Three.js 網絡庫載入失敗，請檢查網絡連線！");
      }

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x38bdf8);
      scene.fog = new THREE.FogExp2(0x38bdf8, 0.0006);

      camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 3500);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      renderer.shadowMap.enabled = true;
      
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfffbebe, 0.9);
      dirLight.position.set(200, 300, -100);
      dirLight.castShadow = true;
      scene.add(dirLight);

      createFarMountains();
      createEnvironment();
      createTracksAndCatenary();
      createMTRTrain();
      createRain();

      window.addEventListener('resize', onWindowResize);
    }

    function createFarMountains() {
      const mtnGroup = new THREE.Group();
      const mtnMat = new THREE.MeshStandardMaterial({ color: 0x1e3a29, roughness: 1.0 });

      for (let i = 0; i < 18; i++) {
        const radius = 60 + Math.random() * 80;
        const height = 120 + Math.random() * 180;
        const geo = new THREE.ConeGeometry(radius, height, 8);
        const mtn = new THREE.Mesh(geo, mtnMat);
        
        const side = i % 2 === 0 ? 1 : -1;
        const x = side * (350 + Math.random() * 200);
        const z = (i * 280) - 1000;
        mtn.position.set(x, height / 2 - 20, z);
        mtnGroup.add(mtn);
      }
      scene.add(mtnGroup);
    }

    function createEnvironment() {
      const groundGeo = new THREE.PlaneGeometry(1600, TRACK_LENGTH * 2);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const roadGeo = new THREE.PlaneGeometry(28, TRACK_LENGTH * 2);
      const roadMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.set(28, 0.1, TRACK_LENGTH / 2);
      scene.add(road);

      const buildingColors = [0x475569, 0x334155, 0x64748b, 0x0284c7, 0x1e293b];
      const winMat = new THREE.MeshBasicMaterial({ color: 0xfef08a });

      for (let z = 0; z < TRACK_LENGTH; z += 50) {
        if (z % 300 === 0 && z > 400) {
          createFlyoverBridge(z);
        }

        if (z === 2400) {
          createMTRStation(z);
        }

        if (z >= 1800) {
          [-55, 60, -90, 95].forEach(xOffset => {
            if (Math.random() > 0.2) {
              const h = 50 + Math.random() * 120;
              const w = 25 + Math.random() * 15;
              const d = 25 + Math.random() * 15;
              
              const bldgMat = new THREE.MeshStandardMaterial({
                color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
                metalness: 0.3,
                roughness: 0.2
              });
              const bldg = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bldgMat);
              bldg.position.set(xOffset, h / 2, z);
              scene.add(bldg);

              const winMesh = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, h * 0.85, d + 0.2), winMat);
              winMesh.position.copy(bldg.position);
              winMesh.scale.set(0.97, 0.95, 0.97);
              scene.add(winMesh);
            }
          });
        }

        if (z % 120 === 0) {
          createDoubleDeckerBus(22, z);
          createRedTaxi(32, z + 50);
        }
      }
    }

    function createFlyoverBridge(zPos) {
      const bridgeGroup = new THREE.Group();
      
      const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x64748b, roughness: 0.4 });
      const bridge = new THREE.Mesh(new THREE.BoxGeometry(130, 3, 14), bridgeMat);
      bridge.position.set(0, 18, zPos);
      bridgeGroup.add(bridge);

      const pMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
      const p1 = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 18), pMat); p1.position.set(-20, 9, zPos);
      const p2 = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 18), pMat); p2.position.set(20, 9, zPos);
      bridgeGroup.add(p1, p2);

      scene.add(bridgeGroup);
    }

    function createDoubleDeckerBus(x, z) {
      const bus = new THREE.Group();
      const busBody = new THREE.Mesh(
        new THREE.BoxGeometry(3.2, 4.2, 10),
        new THREE.MeshStandardMaterial({ color: 0xbe123c, metalness: 0.3 })
      );
      busBody.position.y = 2.3;
      
      const windowMesh = new THREE.Mesh(
        new THREE.BoxGeometry(3.3, 1.2, 8.8),
        new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 })
      );
      windowMesh.position.y = 3.2;

      bus.add(busBody, windowMesh);
      bus.position.set(x, 0, z);
      scene.add(bus);

      vehicles.push({ group: bus, speed: 22 });
    }

    function createRedTaxi(x, z) {
      const taxi = new THREE.Group();
      const lower = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.0, 4.8), new THREE.MeshStandardMaterial({ color: 0xbe123c }));
      lower.position.y = 0.8;
      const upper = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.8, 2.6), new THREE.MeshStandardMaterial({ color: 0xf8fafc }));
      upper.position.set(0, 1.7, -0.2);

      taxi.add(lower, upper);
      taxi.position.set(x, 0, z);
      scene.add(taxi);

      vehicles.push({ group: taxi, speed: 32 });
    }

    function createMTRStation(zPos) {
      const station = new THREE.Group();

      const platMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
      const plat = new THREE.Mesh(new THREE.BoxGeometry(9, 2.5, 200), platMat);
      plat.position.set(7.5, 6, zPos);
      station.add(plat);

      const psdMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5 });
      const psdBorder = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
      for (let z = zPos - 90; z <= zPos + 90; z += 12) {
        const door = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.2, 8), psdMat);
        door.position.set(3.0, 8.3, z);
        const frame = new THREE.Mesh(new THREE.BoxGeometry(0.25, 2.4, 0.5), psdBorder);
        frame.position.set(3.0, 8.4, z + 4);
        station.add(door, frame);
      }

      const roofMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
      const roof = new THREE.Mesh(new THREE.BoxGeometry(11, 0.6, 200), roofMat);
      roof.position.set(7.5, 13, zPos);
      station.add(roof);

      const pillarMat = new THREE.MeshStandardMaterial({ color: 0x0369a1 });
      for (let z = zPos - 90; z <= zPos + 90; z += 25) {
        const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 7), pillarMat);
        p1.position.set(3.5, 9.5, z);
        const p2 = p1.clone();
        p2.position.x = 11.5;
        station.add(p1, p2);
      }

      scene.add(station);
    }

    function createTracksAndCatenary() {
      const trackGroup = new THREE.Group();

      const bridge = new THREE.Mesh(
        new THREE.BoxGeometry(7, 2, TRACK_LENGTH * 2),
        new THREE.MeshStandardMaterial({ color: 0x64748b })
      );
      bridge.position.set(0, 5, TRACK_LENGTH / 2);
      trackGroup.add(bridge);

      const pillarMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
      for (let z = 0; z < TRACK_LENGTH; z += 35) {
        const pillar = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.2, 5), pillarMat);
        pillar.position.set(0, 2.5, z);
        trackGroup.add(pillar);

        const pole1 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 5.5), pillarMat);
        pole1.position.set(-3.2, 8.8, z);
        const pole2 = pole1.clone(); pole2.position.x = 3.2;
        const cross = new THREE.Mesh(new THREE.BoxGeometry(6.6, 0.2, 0.2), pillarMat);
        cross.position.set(0, 11.5, z);
        trackGroup.add(pole1, pole2, cross);
      }

      const railMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.9, roughness: 0.1 });
      const leftRail = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.35, TRACK_LENGTH * 2), railMat); leftRail.position.set(-1.8, 6.2, TRACK_LENGTH / 2);
      const rightRail = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.35, TRACK_LENGTH * 2), railMat); rightRail.position.set(1.8, 6.2, TRACK_LENGTH / 2);
      trackGroup.add(leftRail, rightRail);

      scene.add(trackGroup);
    }

    function createMTRTrain() {
      if (trainGroup) scene.remove(trainGroup);
      trainGroup = new THREE.Group();

      const carLength = 22;

      for (let c = 0; c < 2; c++) {
        const car = new THREE.Group();
        const zOffset = -c * (carLength + 0.8);

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.85, roughness: 0.15 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(3.6, 3.8, carLength), bodyMat);
        body.position.y = 8.1;
        car.add(body);

        if (c === 0) {
          const noseMat = new THREE.MeshStandardMaterial({ color: 0xbe123c, metalness: 0.3, roughness: 0.2 });
          const nose = new THREE.Mesh(new THREE.BoxGeometry(3.62, 3.82, 2.5), noseMat);
          nose.position.set(0, 8.1, carLength / 2 + 1.0);
          car.add(nose);

          const cabWin = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.4, 0.2), new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 }));
          cabWin.position.set(0, 8.8, carLength / 2 + 2.3);
          car.add(cabWin);
        }

        const stripe = new THREE.Mesh(
          new THREE.BoxGeometry(3.68, 0.35, carLength),
          new THREE.MeshStandardMaterial({ color: 0xbe123c })
        );
        stripe.position.y = 7.1;
        car.add(stripe);

        const winMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.1 });
        for (let z = -carLength / 2 + 3; z < carLength / 2 - 2; z += 4.5) {
          const winL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 2.0), winMat);
          winL.position.set(-1.81, 8.5, z);
          const winR = winL.clone(); winR.position.x = 1.81;
          car.add(winL, winR);
        }

        if (c === 1) {
          const pantoMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9 });
          const arm = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.15, 1.2), pantoMat);
          arm.position.set(0, 10.3, 0);
          car.add(arm);
        }

        car.position.z = zOffset;
        trainGroup.add(car);
      }

      headLight = new THREE.SpotLight(0xfffbebe, 0, 180, Math.PI / 5, 0.5);
      headLight.position.set(0, 8.0, 14);
      headLight.target.position.set(0, 0, 80);
      trainGroup.add(headLight);
      trainGroup.add(headLight.target);

      scene.add(trainGroup);
    }

    function createRain() {
      const rainCount = 4000;
      const rainGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(rainCount * 3);
      for (let i = 0; i < rainCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 200;
        positions[i + 1] = Math.random() * 100;
        positions[i + 2] = (Math.random() - 0.5) * 200;
      }
      rainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      rainParticles = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0xe2e8f0, size: 0.4, transparent: true, opacity: 0.6 }));
      rainParticles.visible = false;
      scene.add(rainParticles);
    }

    function updateCamera() {
      if (!trainGroup) return;
      const tPos = trainGroup.position;

      if (state.cameraMode === 0) {
        camera.position.set(tPos.x, tPos.y + 8.8, tPos.z + 13.5);
        camera.lookAt(tPos.x, tPos.y + 8.5, tPos.z + 120);
      } else if (state.cameraMode === 1) {
        camera.position.set(tPos.x + 16, tPos.y + 16, tPos.z - 35);
        camera.lookAt(tPos.x, tPos.y + 8, tPos.z + 10);
      } else if (state.cameraMode === 2) {
        camera.position.set(tPos.x, tPos.y + 80, tPos.z - 10);
        camera.lookAt(tPos.x, tPos.y, tPos.z + 30);
      }
    }

    function updateWeatherUI() {
      const btn = document.getElementById('btn-weather');
      if (state.weatherMode === 0) {
        scene.background.setHex(0x38bdf8);
        scene.fog.color.setHex(0x38bdf8);
        headLight.intensity = 0;
        rainParticles.visible = false;
        btn.innerText = "☀️ 天氣: 晴天";
      } else if (state.weatherMode === 1) {
        scene.background.setHex(0x475569);
        scene.fog.color.setHex(0x475569);
        headLight.intensity = 1.5;
        rainParticles.visible = true;
        btn.innerText = "🌧️ 天氣: 雨天";
      } else if (state.weatherMode === 2) {
        scene.background.setHex(0x020617);
        scene.fog.color.setHex(0x020617);
        headLight.intensity = 3.5;
        rainParticles.visible = false;
        btn.innerText = "🌙 天氣: 夜晚";
      }
    }

    function playHornSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sawtooth'; osc2.type = 'sawtooth';
        osc1.frequency.setValueAtTime(293.66, audioCtx.currentTime);
        osc2.frequency.setValueAtTime(349.23, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.8);

        osc1.connect(gain); osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(); osc2.start();
        osc1.stop(audioCtx.currentTime + 1.8);
        osc2.stop(audioCtx.currentTime + 1.8);
      } catch (e) {}
    }

    function updatePhysics(delta) {
      const accel = (state.power / 100) * 16.0;
      const decel = (state.brake / 100) * 32.0 + 1.2;

      if (state.power > 0) state.speed += accel * delta;
      if (state.brake > 0 || state.power === 0) state.speed -= decel * delta;

      state.speed = Math.max(0, Math.min(state.maxSpeed, state.speed));

      const moveDist = ((state.speed * 1000) / 3600) * delta;
      state.trainZ += moveDist;
      state.distance += moveDist;

      if (trainGroup) trainGroup.position.z = state.trainZ;

      if (state.trainZ > TRACK_LENGTH) {
        state.trainZ -= TRACK_LENGTH;
        if (trainGroup) trainGroup.position.z = state.trainZ;
      }

      const zEl = document.getElementById('zone-indicator');
      if (state.trainZ < 1800) {
        zEl.innerText = "當前位置：🏞️ 郊區高架橋段";
      } else if (state.trainZ >= 1800 && state.trainZ < 2800) {
        zEl.innerText = "當前位置：🚉 觀塘綫高架車站";
      } else {
        zEl.innerText = "當前位置：🏙️ 九龍市區摩天大樓群";
      }

      vehicles.forEach(v => {
        v.group.position.z += v.speed * delta;
        if (v.group.position.z > TRACK_LENGTH) v.group.position.z = 0;
      });

      if (rainParticles && rainParticles.visible) {
        rainParticles.position.z = state.trainZ;
        const pos = rainParticles.geometry.attributes.position.array;
        for (let i = 1; i < pos.length; i += 3) {
          pos[i] -= 90 * delta;
          if (pos[i] < 0) pos[i] = 100;
        }
        rainParticles.geometry.attributes.position.needsUpdate = true;
      }
    }

    function updateUI() {
      document.getElementById('val-speed').innerText = Math.round(state.speed);
      document.getElementById('val-power').innerText = state.power;
      document.getElementById('val-brake').innerText = state.brake;
      document.getElementById('val-dist').innerText = (state.distance / 1000).toFixed(2);
      document.getElementById('speed-bar').style.width = `${(state.speed / state.maxSpeed) * 100}%`;
    }

    function setupEvents() {
      const sliderPower = document.getElementById('slider-power');
      const sliderBrake = document.getElementById('slider-brake');

      sliderPower.addEventListener('input', (e) => {
        state.power = parseInt(e.target.value);
        if (state.power > 0 && state.brake > 0) {
          state.brake = 0; sliderBrake.value = 0;
        }
      });

      sliderBrake.addEventListener('input', (e) => {
        state.brake = parseInt(e.target.value);
        if (state.brake > 0 && state.power > 0) {
          state.power = 0; sliderPower.value = 0;
        }
      });

      document.getElementById('btn-horn').addEventListener('click', playHornSound);

      document.getElementById('btn-camera').addEventListener('click', () => {
        state.cameraMode = (state.cameraMode + 1) % 3;
        const names = ["駕駛艙", "全景跟隨", "鳥瞰視角"];
        document.getElementById('btn-camera').innerText = `🎥 視角: ${names[state.cameraMode]}`;
      });

      document.getElementById('btn-weather').addEventListener('click', () => {
        state.weatherMode = (state.weatherMode + 1) % 3;
        updateWeatherUI();
      });

      document.getElementById('btn-train').addEventListener('click', () => {
        state.trainType = state.trainType === 0 ? 1 : 0;
        state.maxSpeed = state.trainType === 0 ? 130 : 160;
        document.getElementById('btn-train').innerText = state.trainType === 0 ? "🚆 車款: 港鐵市區綫" : "🚆 車款: 機場快綫";
        createMTRTrain();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
          state.power = Math.min(100, state.power + 10); state.brake = 0;
        } else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') {
          state.brake = Math.min(100, state.brake + 10); state.power = 0;
        } else if (e.key === 'h' || e.key === 'H') {
          playHornSound();
        } else if (e.key === 'c' || e.key === 'C') {
          document.getElementById('btn-camera').click();
        }
        sliderPower.value = state.power;
        sliderBrake.value = state.brake;
      });
    }

    function onWindowResize() {
      if (!renderer || !camera) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      updatePhysics(delta);
      updateCamera();
      updateUI();
      renderer.render(scene, camera);
    }

    window.onload = () => {
      initScene();
      setupEvents();
      animate();
    };
  </script>
</body>
</html>
