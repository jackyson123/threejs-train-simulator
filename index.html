<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 模擬列車駕駛器 | Three.js Train Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #fff;
    }
    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .interactive { pointer-events: auto; }
    .top-hud { display: flex; justify-content: space-between; align-items: flex-start; }
    .brand-title {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .brand-title h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-title p { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .hud-stats { display: flex; gap: 12px; }
    .stat-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 18px;
      border-radius: 12px;
      min-width: 105px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
    .stat-value { font-size: 22px; font-weight: 800; color: #f8fafc; font-family: monospace; }
    .stat-unit { font-size: 11px; color: #38bdf8; margin-left: 2px; }
    .controls-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
    .control-panel {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .lever-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .lever-label { font-size: 11px; font-weight: 600; color: #cbd5e1; }
    .slider-vertical { -webkit-appearance: slider-vertical; width: 24px; height: 110px; cursor: pointer; }
    .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.2); border-color: #38bdf8; color: #fff; }
    .btn-horn { background: linear-gradient(135deg, #e11d48, #be123c); border: none; color: #fff; }
    .progress-bar-bg { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; margin-top: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #f43f5e); transition: width 0.1s linear; }
    
    #err-log {
      position: absolute;
      top: 80px;
      left: 20px;
      color: #f43f5e;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      display: none;
      z-index: 99;
    }
  </style>

  <!-- ES Module Import for Three.js (穩定官方來源) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="err-log"></div>
  <div id="webgl-container"></div>

  <div id="ui-container">
    <div class="top-hud">
      <div class="brand-title interactive">
        <h1>🚄 THREE.JS TRAIN SIMULATOR</h1>
        <p>高質感 3D 模擬列車駕駛系統</p>
      </div>

      <div class="hud-stats">
        <div class="stat-card">
          <div class="stat-label">時速 Speed</div>
          <div><span class="stat-value" id="val-speed">0</span><span class="stat-unit">km/h</span></div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="speed-bar"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">動力 Power</div>
          <div><span class="stat-value" id="val-power">0</span><span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">煞車 Brake</div>
          <div><span class="stat-value" id="val-brake">0</span><span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">里程 Distance</div>
          <div><span class="stat-value" id="val-dist">0.00</span><span class="stat-unit">km</span></div>
        </div>
      </div>
    </div>

    <div class="controls-bottom">
      <div class="control-panel interactive">
        <div class="lever-container">
          <div class="lever-label">⚡ 電門 (P)</div>
          <input type="range" class="slider-vertical" id="slider-power" min="0" max="100" value="0">
        </div>
        <div class="lever-container">
          <div class="lever-label">🛑 煞車 (B)</div>
          <input type="range" class="slider-vertical" id="slider-brake" min="0" max="100" value="0">
        </div>
      </div>

      <div class="control-panel interactive">
        <div class="btn-grid">
          <button class="btn btn-horn" id="btn-horn">🔊 鳴笛 (Horn)</button>
          <button class="btn" id="btn-camera">🎥 視角: 全景跟隨</button>
          <button class="btn" id="btn-weather">☀️ 天氣: 晴天</button>
          <button class="btn" id="btn-train">🚆 車款: 高鐵</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    window.onerror = function(msg, url, line) {
      const el = document.getElementById('err-log');
      el.style.display = 'block';
      el.innerText = `Error: ${msg} (Line ${line})`;
    };

    const state = {
      speed: 0,
      maxSpeed: 280,
      power: 0,
      brake: 0,
      distance: 0,
      cameraMode: 1, // 預設 1: 全景跟隨
      weatherMode: 0,
      trainType: 0,
      trainZ: 0
    };

    let scene, camera, renderer;
    let trainGroup, headLight, rainParticles;
    const TRACK_LENGTH = 3000;

    function initScene() {
      const container = document.getElementById('webgl-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x38bdf8);
      scene.fog = new THREE.FogExp2(0x38bdf8, 0.0012);

      camera = new THREE.PerspectiveCamera(65, width / height, 0.1, 2000);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
      
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(100, 150, -50);
      scene.add(dirLight);

      createEnvironment();
      createTracks();
      createTrain();
      createRain();

      window.addEventListener('resize', onWindowResize);
    }

    function createEnvironment() {
      const groundGeo = new THREE.PlaneGeometry(1200, TRACK_LENGTH * 2);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.9 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const treeGeo = new THREE.ConeGeometry(4, 12, 5);
      const trunkGeo = new THREE.CylinderGeometry(0.6, 0.6, 4);
      const treeMat = new THREE.MeshStandardMaterial({ color: 0x15803d });
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x78350f });

      for (let z = -TRACK_LENGTH; z < TRACK_LENGTH; z += 25) {
        [-20, 20, -35, 35].forEach(xOffset => {
          if (Math.random() > 0.25) {
            const group = new THREE.Group();
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            const leaves = new THREE.Mesh(treeGeo, treeMat);
            leaves.position.y = 8;
            group.add(trunk, leaves);
            group.position.set(xOffset + (Math.random() * 8 - 4), 0, z);
            scene.add(group);
          }
        });

        if (z % 50 === 0) {
          const poleGroup = new THREE.Group();
          const poleGeo = new THREE.CylinderGeometry(0.3, 0.3, 14);
          const poleMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
          const pole = new THREE.Mesh(poleGeo, poleMat);
          pole.position.y = 7;

          const armGeo = new THREE.BoxGeometry(6, 0.3, 0.3);
          const arm = new THREE.Mesh(armGeo, poleMat);
          arm.position.set(2.5, 12, 0);

          poleGroup.add(pole, arm);
          poleGroup.position.set(-8, 0, z);
          scene.add(poleGroup);
        }
      }
    }

    function createTracks() {
      const trackGroup = new THREE.Group();

      const bedGeo = new THREE.BoxGeometry(6, 0.6, TRACK_LENGTH * 2);
      const bedMat = new THREE.MeshStandardMaterial({ color: 0x475569 });
      const bed = new THREE.Mesh(bedGeo, bedMat);
      bed.position.y = 0.3;
      trackGroup.add(bed);

      const railGeo = new THREE.BoxGeometry(0.25, 0.35, TRACK_LENGTH * 2);
      const railMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.9, roughness: 0.1 });
      
      const leftRail = new THREE.Mesh(railGeo, railMat);
      leftRail.position.set(-1.8, 0.75, 0);
      const rightRail = new THREE.Mesh(railGeo, railMat);
      rightRail.position.set(1.8, 0.75, 0);
      trackGroup.add(leftRail, rightRail);

      const sleeperGeo = new THREE.BoxGeometry(4.8, 0.2, 0.6);
      const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
      for (let z = -TRACK_LENGTH; z < TRACK_LENGTH; z += 2.5) {
        const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
        sleeper.position.set(0, 0.6, z);
        trackGroup.add(sleeper);
      }

      scene.add(trackGroup);
    }

    function createTrain() {
      if (trainGroup) scene.remove(trainGroup);
      trainGroup = new THREE.Group();

      const isBullet = state.trainType === 0;
      const trainLength = 26;
      const trainColor = isBullet ? 0xf8fafc : 0x0284c7;

      const bodyGeo = new THREE.BoxGeometry(3.6, 3.8, trainLength);
      const bodyMat = new THREE.MeshStandardMaterial({ color: trainColor, metalness: 0.2, roughness: 0.2 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 2.7;
      trainGroup.add(body);

      if (isBullet) {
        const noseGeo = new THREE.ConeGeometry(2.2, 7, 4);
        const noseMat = new THREE.MeshStandardMaterial({ color: trainColor, metalness: 0.3 });
        const nose = new THREE.Mesh(noseGeo, noseMat);
        nose.rotation.x = Math.PI / 2;
        nose.rotation.y = Math.PI / 4;
        nose.position.set(0, 2.3, trainLength / 2 + 3);
        trainGroup.add(nose);
      }

      const windowMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1 });
      for (let z = -trainLength / 2 + 3; z < trainLength / 2 - 2; z += 3.5) {
        const winLeft = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.2, 2.2), windowMat);
        winLeft.position.set(-1.81, 3.2, z);
        const winRight = winLeft.clone();
        winRight.position.x = 1.81;
        trainGroup.add(winLeft, winRight);
      }

      headLight = new THREE.SpotLight(0xffffff, 0, 180, Math.PI / 5, 0.5);
      headLight.position.set(0, 2.5, trainLength / 2 + 2);
      headLight.target.position.set(0, 0, trainLength / 2 + 60);
      trainGroup.add(headLight);
      trainGroup.add(headLight.target);

      scene.add(trainGroup);
    }

    function createRain() {
      const rainCount = 4000;
      const rainGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(rainCount * 3);

      for (let i = 0; i < rainCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 200;
        positions[i + 1] = Math.random() * 100;
        positions[i + 2] = (Math.random() - 0.5) * 200;
      }

      rainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const rainMat = new THREE.PointsMaterial({ color: 0xe2e8f0, size: 0.4, transparent: true, opacity: 0.6 });
      rainParticles = new THREE.Points(rainGeo, rainMat);
      rainParticles.visible = false;
      scene.add(rainParticles);
    }

    function updateCamera() {
      if (!trainGroup) return;
      const trainPos = trainGroup.position;

      if (state.cameraMode === 0) {
        camera.position.set(trainPos.x, trainPos.y + 2.4, trainPos.z + 16);
        camera.lookAt(trainPos.x, trainPos.y + 2.0, trainPos.z + 120);
      } else if (state.cameraMode === 1) {
        camera.position.set(trainPos.x + 14, trainPos.y + 10, trainPos.z - 30);
        camera.lookAt(trainPos.x, trainPos.y + 2, trainPos.z + 10);
      } else if (state.cameraMode === 2) {
        camera.position.set(trainPos.x, trainPos.y + 70, trainPos.z - 5);
        camera.lookAt(trainPos.x, trainPos.y, trainPos.z + 25);
      }
    }

    function updateWeatherUI() {
      const btn = document.getElementById('btn-weather');
      if (state.weatherMode === 0) {
        scene.background.setHex(0x38bdf8);
        scene.fog.color.setHex(0x38bdf8);
        headLight.intensity = 0;
        rainParticles.visible = false;
        btn.innerText = "☀️ 天氣: 晴天";
      } else if (state.weatherMode === 1) {
        scene.background.setHex(0x475569);
        scene.fog.color.setHex(0x475569);
        headLight.intensity = 1.5;
        rainParticles.visible = true;
        btn.innerText = "🌧️ 天氣: 雨天";
      } else if (state.weatherMode === 2) {
        scene.background.setHex(0x020617);
        scene.fog.color.setHex(0x020617);
        headLight.intensity = 3.5;
        rainParticles.visible = false;
        btn.innerText = "🌙 天氣: 夜晚";
      }
    }

    function playHornSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sawtooth';
        osc2.type = 'sawtooth';
        osc1.frequency.setValueAtTime(311.13, audioCtx.currentTime);
        osc2.frequency.setValueAtTime(370.00, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.8);

        osc1.connect(gain); osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(); osc2.start();
        osc1.stop(audioCtx.currentTime + 1.8);
        osc2.stop(audioCtx.currentTime + 1.8);
      } catch (e) {}
    }

    function updatePhysics(delta) {
      const accel = (state.power / 100) * 20.0;
      const decel = (state.brake / 100) * 38.0 + 1.5;

      if (state.power > 0) state.speed += accel * delta;
      if (state.brake > 0 || state.power === 0) state.speed -= decel * delta;

      state.speed = Math.max(0, Math.min(state.maxSpeed, state.speed));

      const moveDistance = ((state.speed * 1000) / 3600) * delta;
      state.trainZ += moveDistance;
      state.distance += moveDistance;

      if (trainGroup) trainGroup.position.z = state.trainZ;

      if (state.trainZ > TRACK_LENGTH) {
        state.trainZ -= TRACK_LENGTH;
        if (trainGroup) trainGroup.position.z = state.trainZ;
      }

      if (rainParticles && rainParticles.visible) {
        rainParticles.position.z = state.trainZ;
        const positions = rainParticles.geometry.attributes.position.array;
        for (let i = 1; i < positions.length; i += 3) {
          positions[i] -= 90 * delta;
          if (positions[i] < 0) positions[i] = 100;
        }
        rainParticles.geometry.attributes.position.needsUpdate = true;
      }
    }

    function updateUI() {
      document.getElementById('val-speed').innerText = Math.round(state.speed);
      document.getElementById('val-power').innerText = state.power;
      document.getElementById('val-brake').innerText = state.brake;
      document.getElementById('val-dist').innerText = (state.distance / 1000).toFixed(2);
      document.getElementById('speed-bar').style.width = `${(state.speed / state.maxSpeed) * 100}%`;
    }

    function setupEvents() {
      const sliderPower = document.getElementById('slider-power');
      const sliderBrake = document.getElementById('slider-brake');

      sliderPower.addEventListener('input', (e) => {
        state.power = parseInt(e.target.value);
        if (state.power > 0 && state.brake > 0) {
          state.brake = 0;
          sliderBrake.value = 0;
        }
      });

      sliderBrake.addEventListener('input', (e) => {
        state.brake = parseInt(e.target.value);
        if (state.brake > 0 && state.power > 0) {
          state.power = 0;
          sliderPower.value = 0;
        }
      });

      document.getElementById('btn-horn').addEventListener('click', playHornSound);

      document.getElementById('btn-camera').addEventListener('click', () => {
        state.cameraMode = (state.cameraMode + 1) % 3;
        const names = ["駕駛艙", "全景跟隨", "鳥瞰視角"];
        document.getElementById('btn-camera').innerText = `🎥 視角: ${names[state.cameraMode]}`;
      });

      document.getElementById('btn-weather').addEventListener('click', () => {
        state.weatherMode = (state.weatherMode + 1) % 3;
        updateWeatherUI();
      });

      document.getElementById('btn-train').addEventListener('click', () => {
        state.trainType = state.trainType === 0 ? 1 : 0;
        state.maxSpeed = state.trainType === 0 ? 280 : 160;
        document.getElementById('btn-train').innerText = state.trainType === 0 ? "🚆 車款: 高鐵" : "🚆 車款: 電聯車";
        createTrain();
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
          state.power = Math.min(100, state.power + 10);
          state.brake = 0;
        } else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') {
          state.brake = Math.min(100, state.brake + 10);
          state.power = 0;
        } else if (e.key === 'h' || e.key === 'H') {
          playHornSound();
        } else if (e.key === 'c' || e.key === 'C') {
          document.getElementById('btn-camera').click();
        }
        sliderPower.value = state.power;
        sliderBrake.value = state.brake;
      });
    }

    function onWindowResize() {
      if (!renderer || !camera) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      updatePhysics(delta);
      updateCamera();
      updateUI();
      renderer.render(scene, camera);
    }

    initScene();
    setupEvents();
    animate();
  </script>
</body>
</html>
