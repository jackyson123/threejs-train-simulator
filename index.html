<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 卡通動漫風港鐵模擬列車駕駛器 | Anime MTR Train Simulator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", sans-serif;
      background: #0f172a;
      color: #fff;
    }
    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .interactive { pointer-events: auto; }
    .top-hud { display: flex; justify-content: space-between; align-items: flex-start; }
    .brand-title {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 20px;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .brand-title h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #f43f5e, #fbbf24, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-title p { font-size: 11px; color: #cbd5e1; margin-top: 2px; }
    .hud-stats { display: flex; gap: 12px; }
    .stat-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 18px;
      border-radius: 12px;
      min-width: 105px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
    .stat-value { font-size: 22px; font-weight: 800; color: #f8fafc; font-family: monospace; }
    .stat-unit { font-size: 11px; color: #38bdf8; margin-left: 2px; }
    .controls-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; }
    .control-panel {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .lever-container { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .lever-label { font-size: 11px; font-weight: 600; color: #cbd5e1; }
    .slider-vertical { -webkit-appearance: slider-vertical; width: 24px; height: 110px; cursor: pointer; }
    .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.25); border-color: #38bdf8; color: #fff; }
    .btn-horn { background: linear-gradient(135deg, #f43f5e, #be123c); border: none; color: #fff; }
    .progress-bar-bg { width: 100%; height: 5px; background: rgba(255, 255, 255, 0.15); border-radius: 3px; margin-top: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #f43f5e); transition: width 0.1s linear; }
  </style>

  <!-- 穩定 Three.js & Post-processing 卡通發光庫 -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>

  <div id="webgl-container"></div>

  <div id="ui-container">
    <div class="top-hud">
      <div class="brand-title interactive">
        <h1>✨ ANIME MTR SIMULATOR</h1>
        <p id="zone-indicator">當前位置：🏞️ 動漫風郊區高架段</p>
      </div>

      <div class="hud-stats">
        <div class="stat-card">
          <div class="stat-label">時速 Speed</div>
          <div><span class="stat-value" id="val-speed">0</span><span class="stat-unit">km/h</span></div>
          <div class="progress-bar-bg"><div class="progress-bar-fill" id="speed-bar"></div></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">電門 Power</div>
          <div><span class="stat-value" id="val-power">0</span><span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">煞車 Brake</div>
          <div><span class="stat-value" id="val-brake">0</span><span class="stat-unit">%</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-label">里程 Distance</div>
          <div><span class="stat-value" id="val-dist">0.00</span><span class="stat-unit">km</span></div>
        </div>
      </div>
    </div>

    <div class="controls-bottom">
      <div class="control-panel interactive">
        <div class="lever-container">
          <div class="lever-label">⚡ 電門 (P)</div>
          <input type="range" class="slider-vertical" id="slider-power" min="0" max="100" value="0">
        </div>
        <div class="lever-container">
          <div class="lever-label">🛑 煞車 (B)</div>
          <input type="range" class="slider-vertical"
